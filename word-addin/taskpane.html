<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://appsforoffice.microsoft.com; script-src 'self' https://appsforoffice.microsoft.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://appsforoffice.microsoft.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Comment Master · Reviewer Names</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root { font-family: Aptos, "Segoe UI", sans-serif; color: #172033; background: #f7f8fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 240px; }
    main { padding: 18px; }
    .eyebrow { margin: 0 0 3px; color: #53627a; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 21px; line-height: 1.2; }
    .lede { margin: 7px 0 18px; color: #53627a; font-size: 13px; line-height: 1.45; }
    .card { padding: 15px; border: 1px solid #dce2ec; border-radius: 10px; background: white; box-shadow: 0 1px 2px rgba(20,31,52,.04); }
    label { display: block; margin: 0 0 6px; font-size: 12px; font-weight: 700; color: #33415c; }
    select, input { width: 100%; height: 38px; border: 1px solid #b9c4d5; border-radius: 7px; background: white; color: #172033; padding: 0 10px; font: inherit; font-size: 13px; }
    select:focus, input:focus, button:focus-visible { outline: 2px solid #4268b2; outline-offset: 1px; }
    .field + .field { margin-top: 13px; }
    .summary { margin-top: 11px; font-size: 12px; line-height: 1.4; color: #53627a; }
    .details { margin-top: 3px; font-size: 11px; color: #738097; }
    .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 15px; }
    button { min-height: 38px; border-radius: 7px; border: 1px solid transparent; padding: 8px 12px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    button.primary { background: #243f77; color: white; }
    button.secondary { background: white; border-color: #c7d0df; color: #33415c; }
    button:disabled { opacity: .45; cursor: default; }
    #status { margin: 12px 1px 0; min-height: 34px; font-size: 12px; line-height: 1.4; color: #53627a; }
    #status[data-kind="success"] { color: #1f6a45; }
    #status[data-kind="error"] { color: #a02d2d; }
    #status[data-kind="working"] { color: #334f87; }
    .privacy { margin: 17px 1px 0; color: #7a879c; font-size: 11px; line-height: 1.45; }
    .busy .card { opacity: .82; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Comment Master</p>
    <h1>Change reviewer names</h1>
    <p class="lede">Change the author name on comments and tracked changes, then open the result as a new Word document.</p>

    <section class="card" aria-label="Reviewer name changer">
      <div class="field">
        <label for="target-author">Change</label>
        <select id="target-author" disabled><option value="__none__">Reading document…</option></select>
      </div>
      <div class="field">
        <label for="replacement-author">To</label>
        <input id="replacement-author" type="text" autocomplete="name" spellcheck="false" placeholder="New reviewer name">
      </div>
      <div id="summary" class="summary"></div>
      <div id="details" class="details"></div>
      <div class="actions">
        <button id="apply" class="primary" type="button" disabled>Change &amp; open copy</button>
        <button id="refresh" class="secondary" type="button" title="Read the current document again">Refresh</button>
      </div>
    </section>

    <div id="status" role="status" aria-live="polite">Starting…</div>
    <p class="privacy">The document is processed locally in Word. Comment Master does not upload its contents.</p>
  </main>
  <script type="module" src="./taskpane.js"></script>
</body>
</html>
