name: Verify Word Sessions v7.2.2
on:
  push:
    branches:
      - fix/7.2.2-word-session
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test all features
        run: npm run qa
      - name: Build synchronized Pages runtime
        run: npm run build:pages
      - name: Publish verified build to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets asset-manifest.json service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Sync verified Word-session release [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
