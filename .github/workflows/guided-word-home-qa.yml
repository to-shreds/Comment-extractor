name: Comment Master v7.3.1 Editorial QA

on:
  push:
    branches:
      - design/editorial-workbench-v7.3.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-qa-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Fetch and verify pinned local editorial fonts
        run: npm run fonts:install
      - name: Run full QA suite
        run: npm run qa
      - name: Synchronize GitHub Pages runtime
        run: npm run build:pages
      - name: Commit verified runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/fonts assets asset-manifest.json service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Sync verified editorial workbench runtime [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
