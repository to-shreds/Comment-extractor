name: Validate prepared Comment Master v7.3.0 release
on:
  push:
    branches:
      - ux/linear-workspace-v7.3.0
permissions:
  contents: write
jobs:
  validate-prepared-release:
    if: github.event.head_commit.message == 'Correct PDF route and mobile overflow regressions before release'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out verified baseline and staged patch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm expected source ancestry and exact patch
        run: |
          test "$(git merge-base HEAD e33d85bc8c8f778347c760a84ffecd4990d6b31e)" = "e33d85bc8c8f778347c760a84ffecd4990d6b31e"
          test "$(git hash-object .release/comment-master-v7.3.0.patch)" = "8124fcda425b4fb52335f290d297f524b754db4f"
          git apply --check .release/comment-master-v7.3.0.patch
      - name: Apply verified application changes
        run: |
          git apply .release/comment-master-v7.3.0.patch
          git restore --source=HEAD -- .github/workflows/guided-word-home-qa.yml
          rm .release/comment-master-v7.3.0.patch
          rmdir .release
          test "$(node -p "require('./package.json').version")" = "7.3.0"
      - name: Preserve visible PDF error reporting and narrow screen layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css_path = Path('src/linear-workspace.css')
          css = css_path.read_text()
          addition = """
          /* Keep the established PDF and tool headers within narrow phone viewports. */
          @media (max-width: 560px) {
            .app-header { padding: 10px 12px; gap: 7px; }
            .brand-block { min-width: 0; }
            .brand-block h1 { font-size: 16px; white-space: nowrap; }
            .brand-mark { width: 32px; height: 32px; }
          }
          """
          if 'Keep the established PDF and tool headers' not in css:
              css_path.write_text(css + '\n' + addition)
          test_path = Path('tests/browser/reliability.spec.mjs')
          test = test_path.read_text()
          original = """test('a malformed PDF dropped into the PDF surface produces a visible error without an unhandled rejection', async ({ page }) => {
            await openShell(page);
            const errors = [];"""
          replacement = """test('a malformed PDF dropped into the PDF surface produces a visible error without an unhandled rejection', async ({ page }) => {
            await openShell(page);
            await page.locator('.linear-other-tools').filter({ hasText: 'PDF tools' }).locator('summary').click();
            await page.locator('[data-linear-pdf="review"]').click();
            await expect(page.locator('#pdf-empty')).toBeVisible();
            const errors = [];"""
          if test.count(original) != 1:
              raise SystemExit('Could not uniquely locate PDF error test. Refusing to rewrite tests.')
          test_path.write_text(test.replace(original, replacement))
          PY
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the complete release regression suite
        run: npm run qa
      - name: Build and synchronize exact Pages assets
        run: npm run build:pages
      - name: Validate generated application runtime
        run: |
          node -e 'const m=require("./asset-manifest.json");if(m.version!=="7.3.0"||!m.files["./assets/linear-workspace.mjs"]||!m.files["./assets/review-summary.mjs"])process.exit(1);console.log("Verified build",m.buildId)'
          cmp src/linear-workspace.mjs assets/linear-workspace.mjs
          cmp src/review-summary.mjs assets/review-summary.mjs
          git diff -- .github/workflows/ | tee /tmp/workflow-diff
          test ! -s /tmp/workflow-diff
      - name: Commit tested release without changing workflow permissions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No changes to release'; exit 1; }
          git commit -m "Comment Master v7.3.0 linear workspace: verified release"
          git push origin HEAD:"${GITHUB_REF_NAME}"
