name: Simplified UI QA

on:
  push:
    branches:
      - simplify-ui-v7-1

permissions:
  contents: write

jobs:
  qa:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run release QA
        run: npm run qa

      - name: Synchronize GitHub Pages runtime
        run: npm run build:pages

      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets asset-manifest.json service-worker.js .nojekyll
          if git diff --cached --quiet; then
            echo "Generated runtime is already synchronized."
          else
            git commit -m "Build v7.1.0 runtime [skip ci]"
            git push
          fi
